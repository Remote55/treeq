[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carbonscan-api"
version = "0.1.0"
description = "CarbonScan AI Backend API — NSC 2026"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "CarbonScan AI Team" }]
keywords = ["carbon-credit", "lidar", "fastapi", "nsc-2026"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Data validation. email-validator is what pydantic's EmailStr needs at
    # runtime, so it is a real dependency even though nothing imports it here.
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # No database. sqlalchemy, asyncpg, geoalchemy2, alembic and python-dotenv
    # were here for six tables with no reader and no writer; the layer is gone.
    # This service computes an analysis and returns it, storing nothing between
    # requests. See docs/DATABASE_TEARDOWN.md.

    # Auth is Supabase's, verified over HTTP in app/services/supabase.py.
    # python-jose and passlib[bcrypt] were here for app/core/security.py, which
    # implemented a second token system that nothing imported; both are gone
    # with it. The supabase SDK was listed too and never imported — that module
    # calls the REST API with httpx.
    "httpx>=0.27.0",

    # Removed as unused: shapely, reportlab (no PDF is generated), rich
    # (nothing renders to a terminal), websockets (already an extra of
    # uvicorn[standard], and no socket is served).

    # Logging — see app/core/logging.py
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    # Pinned: an unpinned ruff lets a new release add rules and turn CI red with
    # no code change. Keep this frozen through the competition; bump deliberately.
    "ruff==0.16.0",
    "black>=24.4.0",
    # Pinned for the reason given above for ruff: mypy is a blocking CI gate
    # now, and a new release adding checks would turn the build red with no
    # code change. `>=1.10.0` would also have installed 2.x silently.
    "mypy==2.3.0",
    "ipython>=8.24.0",
    "ipdb>=0.13.13",
    "factory-boy>=3.3.0",
]

[project.urls]
Repository = "https://github.com/Remote55/treeq"
Issues = "https://github.com/Remote55/treeq/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff (linter + formatter) ---
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "B",   # bugbear
    "ASYNC", # async checks
    "C4",  # comprehensions
    "PIE", # misc
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # FastAPI Depends() in defaults
    # ρ, × and π are the notation the allometric equations are written in, and
    # the schema comments quote them. services/ml already ignores these three
    # for the same reason; the API carries the same prose, so it needs the same
    # exemption. Without it `ruff check .` fails on app/schemas/analyze.py.
    "RUF001",  # ambiguous unicode in strings
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
    "N802",  # uppercase @property names match env-var-style settings (CORS_ORIGINS_LIST)
    "N818",  # AppException base class doesn't need "Error" suffix
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Black ---
[tool.black]
line-length = 100
target-version = ["py311"]

# --- mypy ---
# `strict = true` sat here for months with nothing running it, so it described a
# standard the code was never held to. It is enforced in CI now, and passes
# clean on the 24 modules under app/.
#
# `files` names the scope so `mypy` with no arguments checks exactly what CI
# checks. tests/ is out: strict mode wants an annotation on every test function
# and fixture, which is 146 errors of `-> None` for no defect it would catch.
# Widening this later is a deliberate act, not a discovery.
[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
