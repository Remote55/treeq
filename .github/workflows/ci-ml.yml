name: CI ML

on:
  push:
    branches: [main]
    paths:
      - "services/ml/**"
      - "packages/run-contract/**"
      - "docs/evidence/core_demo_manifest.json"
      - "docs/evidence/pointnet_independent_eval/**"
      - "docs/CAPABILITY_MATRIX.md"
      - "docs/PROJECT_SPEC.md"
      - "docs/ml/PIPELINE.md"
      - "docs/ml/WOODLEAF_RESULTS.md"
      - "docs/ml/ALLOMETRIC.md"
      - "README.md"
      - "AGENTS.md"
      - "scripts/sync_truth.py"
      - "scripts/review_pointnet_evidence.py"
      - "scripts/build_truth_aligned_report.py"
      - "scripts/tests/**"
      - "docs/DOCUMENT_STATUS.md"
      - "proposal/**"
      - "services/api/README.md"
      - "apps/web/README.md"
      - "apps/web/src/generated/core-demo-evidence.ts"
      - "apps/web/public/demo/**"
      - "docs/evidence/judge_demo_manifest.json"
      - ".github/workflows/ci-ml.yml"
  pull_request:
    paths:
      - "services/ml/**"
      - "packages/run-contract/**"
      - "docs/evidence/core_demo_manifest.json"
      - "docs/evidence/pointnet_independent_eval/**"
      - "docs/CAPABILITY_MATRIX.md"
      - "docs/PROJECT_SPEC.md"
      - "docs/ml/PIPELINE.md"
      - "docs/ml/WOODLEAF_RESULTS.md"
      - "docs/ml/ALLOMETRIC.md"
      - "README.md"
      - "AGENTS.md"
      - "scripts/sync_truth.py"
      - "scripts/review_pointnet_evidence.py"
      - "scripts/build_truth_aligned_report.py"
      - "scripts/tests/**"
      - "docs/DOCUMENT_STATUS.md"
      - "proposal/**"
      - "services/api/README.md"
      - "apps/web/README.md"
      - "apps/web/src/generated/core-demo-evidence.ts"
      - "apps/web/public/demo/**"
      - "docs/evidence/judge_demo_manifest.json"
      - ".github/workflows/ci-ml.yml"

concurrency:
  group: ci-ml-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint + Test (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch evidence-cited history
        # Evidence manifests record the commit an evaluation actually ran at.
        # Squash-merging leaves those commits only on their feature branch, and a
        # pull-request checkout fetches just the PR ref, so `git cat-file -e <sha>`
        # cannot resolve them and the integrity check fails on a missing object
        # rather than on real tampering. Fetch every branch and tag so the check
        # can do its job. This does not relax the check itself.
        run: git fetch --quiet --tags origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/ml/pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libgl1 replaces libgl1-mesa-glx on Ubuntu 24.04+
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libgeos-dev \
            libproj-dev

      # packages/run-contract is a workspace package, not a PyPI release, so it
      # has to be on the path before the service that depends on it is
      # installed. Without this, `pip install -e .` below goes looking for
      # treeq-run-contract on PyPI and fails.
      - name: Install the run contract
        run: pip install -e packages/run-contract

      - name: Install Python dependencies (CPU)
        working-directory: services/ml
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first (faster than full GPU image)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install python-docx

      # photogrammetry/ used to be listed here. It has no tracked files - the
      # photo path was dropped and its modules deleted - so on a fresh checkout
      # the directory does not exist and ruff exits with E902 "cannot find the
      # file specified" before linting anything. This step has therefore been
      # failing, which is its own answer to why lint drift went unnoticed.
      - name: Ruff lint
        working-directory: services/ml
        run: ruff check pipeline/ training/ scripts/ tests/ ../../scripts/*.py ../../scripts/tests/

      - name: Ruff format check (advisory)
        working-directory: services/ml
        # Phase 1: re-enable strict after running `ruff format .` locally.
        run: ruff format --check --diff pipeline/ training/ tests/ || echo "::warning::Ruff format drift"

      - name: Run allometric tests
        working-directory: services/ml
        run: pytest tests/test_allometric.py -v --cov=pipeline.allometric --cov-report=term-missing

      - name: Run all tests
        working-directory: services/ml
        # -rs lists every skip WITH ITS REASON in the summary. Without it this
        # job reports "649 passed, 35 skipped" and the 35 are invisible — they
        # are the tests that check DBH, height and volume against destructively
        # harvested trees, and they skip here because the Demol cohort and the
        # PointNet++ checkpoint are too large for git. A green tick on this job
        # does not mean the measurement was checked; see
        # docs/ml/WHAT_CI_DOES_NOT_CHECK.md.
        run: pytest tests/ -v --tb=short -rs

      - name: Run repository truth and report contract tests
        run: python -m pytest scripts/tests/ -v --no-cov

      - name: Verify published artifacts are current
        # The suite above covers the document gates. This runs the demo
        # artefact gate as a command, because that is how it fails in practice:
        # judge_demo_manifest.py check is what a person runs, and its staleness
        # branch is reachable only through the CLI.
        #
        # Nothing here needs a cohort or a pipeline run - it compares committed
        # artefacts and committed text against the manifest - so unlike the
        # accuracy tests in docs/ml/WHAT_CI_DOES_NOT_CHECK.md these cannot skip,
        # and a green tick means they actually ran.
        run: python scripts/judge_demo_manifest.py check

      - name: Verify deterministic core demo
        working-directory: services/ml
        # --manifest compares the run against the figures published in
        # validation.core_demo. Without it the step proved only that two runs
        # agree with each other, so the manifest sat at pipeline_version 0.3.0
        # with totals 1.9% adrift and every check green. This is the Demol
        # defect (docs/ml/DEMOL_EVIDENCE_CHAIN.md) closed properly, because a
        # synthetic plot with a fixed seed needs no 691 MB cohort to re-derive.
        run: >
          python scripts/run_core_demo.py
          --output-dir ../../temp/ci-core-demo
          --repo-root ../..
          --manifest ../../docs/evidence/core_demo_manifest.json

      - name: Verify evidence and documentation truth
        working-directory: services/ml
        run: python ../../scripts/sync_truth.py --check
